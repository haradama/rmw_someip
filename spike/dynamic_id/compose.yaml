name: rmw-someip-spike

# For the Phase 0 spike.
#   - Separate network namespaces, so each container has its own routing manager
#   - Communication between them is established only through SOME/IP-SD multicast
#   - Static IPs, because they have to match "unicast" in each vsomeip.json

services:
  provider:
    image: rmw_someip/base:jazzy
    container_name: someip_spike_provider
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/dynamic_id/config/provider.json
      VSOMEIP_APPLICATION_NAME: provider
    volumes:
      - ../..:/ws
    networks:
      someip_net:
        ipv4_address: 172.30.0.11
    # Without a multicast route vsomeip never starts SD (docs/design.md §3)
    cap_add:
      - NET_ADMIN
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/dynamic_id/build/provider"]

  consumer:
    image: rmw_someip/base:jazzy
    container_name: someip_spike_consumer
    depends_on:
      - provider
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/dynamic_id/config/consumer.json
      VSOMEIP_APPLICATION_NAME: consumer
    volumes:
      - ../..:/ws
    networks:
      someip_net:
        ipv4_address: 172.30.0.12
    # Without a multicast route vsomeip never starts SD (docs/design.md §3)
    cap_add:
      - NET_ADMIN
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/dynamic_id/build/consumer"]

networks:
  someip_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
