name: rmw-someip-spike3
x-common: &common
  image: rmw_someip/base:jazzy
  volumes: [ "../..:/ws" ]
  cap_add: [ NET_ADMIN ]

services:
  provider1:
    <<: *common
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/wildcard_discovery/config/provider1.json
      VSOMEIP_APPLICATION_NAME: provider
      PARTICIPANT_INSTANCE: "0x0001"
    networks: { someip_net: { ipv4_address: 172.30.0.11 } }
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/wildcard_discovery/build/provider"]
  provider2:
    <<: *common
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/wildcard_discovery/config/provider2.json
      VSOMEIP_APPLICATION_NAME: provider
      PARTICIPANT_INSTANCE: "0x0002"
    networks: { someip_net: { ipv4_address: 172.30.0.12 } }
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/wildcard_discovery/build/provider"]
  consumer:
    <<: *common
    depends_on: [ provider1, provider2 ]
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/wildcard_discovery/config/consumer.json
      VSOMEIP_APPLICATION_NAME: consumer
    networks: { someip_net: { ipv4_address: 172.30.0.20 } }
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/wildcard_discovery/build/consumer"]

networks:
  someip_net:
    driver: bridge
    ipam: { config: [ { subnet: 172.30.0.0/24 } ] }
