name: rmw-someip-spike2

services:
  provider:
    image: rmw_someip/base:jazzy
    container_name: someip_spike2_provider
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/multi_event/config/provider.json
      VSOMEIP_APPLICATION_NAME: provider
    volumes: [ "../..:/ws" ]
    cap_add: [ NET_ADMIN ]
    networks:
      someip_net: { ipv4_address: 172.30.0.11 }
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/multi_event/build/provider"]

  consumer:
    image: rmw_someip/base:jazzy
    container_name: someip_spike2_consumer
    depends_on: [ provider ]
    environment:
      VSOMEIP_CONFIGURATION: /ws/spike/multi_event/config/consumer.json
      VSOMEIP_APPLICATION_NAME: consumer
    volumes: [ "../..:/ws" ]
    cap_add: [ NET_ADMIN ]
    networks:
      someip_net: { ipv4_address: 172.30.0.12 }
    command: ["bash","-c","ip route add 224.0.0.0/4 dev eth0; exec /ws/spike/multi_event/build/consumer"]

networks:
  someip_net:
    driver: bridge
    ipam:
      config: [ { subnet: 172.30.0.0/24 } ]
